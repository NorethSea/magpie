<main><h1>#1042 界面预览</h1><p class="m">commit c9dc7a5 · <a href="https://github.com/yetone/magpie/pull/1042">回到 PR</a> · 这个 diff 只改 macOS 上的原生窗口外壳：在 macOS 26 的设计里把主窗口自带的空 NSToolbar 摘掉，让窗口圆角从工具栏窗口的（26pt）变成普通标题栏窗口的（16pt），同时把交通灯位置、标题栏高度、sheet 起始位置和「别的 App 在前时按标题栏拖动窗口」的行为维持成工具栏时的样子；页面自身、页面上的导航和按钮都不变。</p>
